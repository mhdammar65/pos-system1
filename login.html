<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login | Wood & Curtain POS
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #3b2416,
                    #6b4428,
                    #a8794e
                );

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .login-container {

            width: 420px;

            max-width: 90%;

        }


        .login-card {

            background: #ffffff;

            border-radius: 18px;

            padding: 40px;

            box-shadow:
                0 25px 70px
                rgba(0, 0, 0, 0.30);

        }


        .logo {

            width: 75px;

            height: 75px;

            margin:
                0 auto 20px;

            border-radius: 16px;

            background: #5a3820;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 38px;

            font-weight: bold;

        }


        h1 {

            margin: 0;

            text-align: center;

            color: #302015;

        }


        .subtitle {

            text-align: center;

            color: #888;

            margin:
                8px 0 30px;

            font-size: 14px;

        }


        .form-group {

            margin-bottom: 20px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #443126;

            font-weight: bold;

        }


        input {

            width: 100%;

            padding: 14px;

            border:
                1px solid #ddd;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

        }


        input:focus {

            border-color:
                #8b5e34;

            box-shadow:
                0 0 0 3px
                rgba(
                    139,
                    94,
                    52,
                    0.12
                );

        }


        .login-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #5a3820;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        .login-button:hover {

            background: #402614;

        }


        .error {

            display: none;

            margin-bottom: 18px;

            padding: 12px;

            background: #ffe5e5;

            color: #b42323;

            border-radius: 8px;

            text-align: center;

            font-size: 14px;

        }


        .footer {

            text-align: center;

            margin-top: 25px;

            color: #999;

            font-size: 12px;

        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="login-card">


        <div class="logo">

            W

        </div>


        <h1>

            Wood & Curtain

        </h1>


        <div class="subtitle">

            POS SYSTEM

        </div>


        <div
            id="loginError"
            class="error"
        >

            Invalid username or password.

        </div>


        <form id="loginForm">


            <div class="form-group">

                <label for="username">

                    Username

                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">

                    Password

                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >

                Login

            </button>


        </form>


        <div class="footer">

            Wood & Curtain POS

        </div>


    </div>


</div>


<script>

const loginForm =
    document.getElementById(
        "loginForm"
    );


const loginError =
    document.getElementById(
        "loginError"
    );


loginForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const username =
            document.getElementById(
                "username"
            ).value.trim();


        const password =
            document.getElementById(
                "password"
            ).value;


        if (
            username === "admin" &&
            password === "admin123"
        ) {

            localStorage.setItem(
                "woodCurtainLoggedIn",
                "true"
            );


            window.location.href =
                "index.html";

        }

        else {

            loginError.style.display =
                "block";

        }

    }
);

</script>


</body>

</html>
