<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Wood & Curtain POS - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #5a3820;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 400px;
            padding: 40px;

            background: white;

            border-radius: 16px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            background: #5a3820;
            color: white;

            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 36px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            margin: 0;

            color: #333;
        }

        .subtitle {
            text-align: center;

            color: #888;

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #444;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #5a3820;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #5a3820;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #402614;
        }

        #error {
            display: none;

            margin-bottom: 15px;

            padding: 10px;

            background: #ffe5e5;

            color: #b00000;

            border-radius: 6px;

            text-align: center;
        }

    </style>

</head>


<body>


<div class="login-box">

    <div class="logo">
        W
    </div>

    <h1>
        Wood & Curtain
    </h1>

    <p class="subtitle">
        POS SYSTEM
    </p>


    <div id="error">
        Invalid username or password.
    </div>


    <form id="loginForm">

        <div class="form-group">

            <label>
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

        </div>


        <button type="submit">
            Login
        </button>

    </form>

</div>


<script>

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            const username =
                document.getElementById(
                    "username"
                ).value.trim();

            const password =
                document.getElementById(
                    "password"
                ).value;


            if (
                username === "admin" &&
                password === "admin123"
            ) {

                localStorage.setItem(
                    "woodCurtainLoggedIn",
                    "true"
                );

                window.location.href =
                    "index.html";

            } else {

                document.getElementById(
                    "error"
                ).style.display =
                    "block";

            }

        }
    );

</script>


</body>

</html>
